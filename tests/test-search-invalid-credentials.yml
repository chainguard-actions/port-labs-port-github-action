name: Test SEARCH operation with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run SEARCH operation with invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'invalid-client-id'
          clientSecret: 'invalid-client-secret'
          operation: 'SEARCH'
          query: '{"rules":[{"property":"$identifier","operator":"contains","value":"test"}],"combinator":"and"}'

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
