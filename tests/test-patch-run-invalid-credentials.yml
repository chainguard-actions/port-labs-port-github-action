name: Test PATCH_RUN operation with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'invalid-client-id'
          clientSecret: 'invalid-client-secret'
          operation: 'PATCH_RUN'
          runId: 'r_fake_run_id_12345'
          status: 'SUCCESS'
          logMessage: 'Test log message from GitHub Actions'
          summary: 'Test run completed'

      - name: Assert action failed with invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected PATCH_RUN operation to fail with invalid credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: PATCH_RUN operation correctly failed with invalid credentials"
