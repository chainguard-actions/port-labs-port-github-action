name: Test UPSERT with relations input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run UPSERT with relations input (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'dummy-client-id'
          clientSecret: 'dummy-client-secret'
          operation: 'UPSERT'
          blueprint: 'test-blueprint'
          identifier: 'test-entity-relations'
          title: 'Test Entity with Relations'
          properties: '{}'
          relations: '{"relatedBlueprint":"related-entity-id"}'

      - name: Assert action failed with auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
