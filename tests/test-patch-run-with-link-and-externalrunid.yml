name: Test PATCH_RUN with link and externalRunId inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PATCH_RUN with link and externalRunId inputs (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'dummy-client-id'
          clientSecret: 'dummy-client-secret'
          operation: 'PATCH_RUN'
          runId: 'r_dummy_run_id_99999'
          status: 'SUCCESS'
          logMessage: 'Test log message with link and externalRunId'
          summary: 'Test summary'
          link: 'https://github.com/example/repo/actions/runs/12345'
          externalRunId: 'ext-run-abc-123'

      - name: Assert action failed with auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
