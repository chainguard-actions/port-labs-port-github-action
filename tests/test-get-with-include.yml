name: Test GET with include input (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'invalid-client-id'
          clientSecret: 'invalid-client-secret'
          operation: 'GET'
          blueprint: 'test-blueprint'
          identifier: 'test-entity'
          include: 'properties.propertyIdentifier,identifier'
      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
