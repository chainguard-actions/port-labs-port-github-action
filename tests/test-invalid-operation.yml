name: Test invalid operation rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'INVALID_OPERATION'

      - name: Assert action failed with unsupported operation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid operation, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid operation"
