name: Test CREATE_RUN operation with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CREATE_RUN with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'invalid-client-id'
          clientSecret: 'invalid-client-secret'
          operation: 'CREATE_RUN'
          action: 'test-action-identifier'
          blueprint: 'test-blueprint'
          identifier: 'test-entity-001'

      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
