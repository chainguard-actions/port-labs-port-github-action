name: Test UPSERT with icon, team, and relations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'invalid-client-id'
          clientSecret: 'invalid-client-secret'
          operation: 'UPSERT'
          blueprint: 'service'
          identifier: 'my-service'
          title: 'My Service'
          icon: 'Github'
          team: 'my-team'
          relations: '{"environment": "production"}'
          properties: '{"language": "python"}'
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
