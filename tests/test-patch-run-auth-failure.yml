name: Test PATCH_RUN operation with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'PATCH_RUN'
          runId: 'fake-run-id-12345'
          status: 'SUCCESS'
          logMessage: 'Test log message'
          summary: 'Test summary'

      - name: Assert action failed due to auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials for PATCH_RUN"
