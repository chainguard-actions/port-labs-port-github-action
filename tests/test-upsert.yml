name: Test UPSERT operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'test-client-id'
          clientSecret: 'test-client-secret'
          operation: 'UPSERT'
          blueprint: 'test-blueprint'
          identifier: 'test-entity-id'
          title: 'Test Entity'
          icon: 'Github'
          team: 'test-team'
          relations: '{}'
          properties: '{"prop1": "value1"}'
      - name: Assert action ran (credentials invalid so failure is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with invalid credentials
          # We just verify it ran (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
