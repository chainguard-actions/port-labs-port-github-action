name: Test UPSERT operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'UPSERT'
          blueprint: 'service'
          identifier: 'my-service'
          title: 'My Service'
          icon: 'Github'
          team: 'my-team'
          relations: '{}'
          properties: '{"language": "python"}'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with invalid credentials
          # but we verify it was invoked with the correct inputs
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
