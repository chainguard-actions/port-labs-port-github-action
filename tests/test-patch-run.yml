name: Test PATCH_RUN operation
on:
  workflow_dispatch:
jobs:
  test-patch-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PATCH_RUN operation
        id: patch_run
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.port.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'PATCH_RUN'
          runId: 'r_fake_run_id_12345'
          status: 'SUCCESS'
          logMessage: 'Deployment completed successfully'
          summary: 'All checks passed'

      - name: Assert action ran and failed gracefully (auth error expected)
        env:
          OUTCOME: ${{ steps.patch_run.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: PATCH_RUN succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
