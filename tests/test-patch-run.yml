name: Test PATCH_RUN operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'test-client-id'
          clientSecret: 'test-client-secret'
          operation: 'PATCH_RUN'
          runId: 'r_test-run-id'
          externalRunId: 'ext-run-123'
          status: 'SUCCESS'
          logMessage: 'Deployment completed successfully'
          link: 'https://example.com/run/123'
          summary: 'All steps completed'
      - name: Assert action ran (credentials invalid so failure is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
