name: Test PATCH_RUN operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'PATCH_RUN'
          runId: 'r_fake-run-id-12345'
          status: 'SUCCESS'
          logMessage: 'Deployment completed successfully'
          link: 'https://github.com/my-org/my-repo/actions/runs/123'
          summary: 'All steps passed'
          externalRunId: 'ext-run-abc-123'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
