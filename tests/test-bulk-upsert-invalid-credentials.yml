name: Test BULK_UPSERT operation with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'invalid-client-id'
          clientSecret: 'invalid-client-secret'
          operation: 'BULK_UPSERT'
          blueprint: 'test-blueprint'
          entities: '[{"identifier":"entity-1","title":"Entity One","properties":{}},{"identifier":"entity-2","title":"Entity Two","properties":{}}]'

      - name: Assert action failed with invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected BULK_UPSERT operation to fail with invalid credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: BULK_UPSERT operation correctly failed with invalid credentials"
