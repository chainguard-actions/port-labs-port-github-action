name: Test SEARCH operation
on:
  workflow_dispatch:
jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run SEARCH operation
        id: search
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.port.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'SEARCH'
          query: '{"combinator":"and","rules":[{"property":"$blueprint","operator":"=","value":"service"}]}'

      - name: Assert action ran and failed gracefully (auth error expected)
        env:
          OUTCOME: ${{ steps.search.outcome }}
          ENTITIES: ${{ steps.search.outputs.entities }}
        run: |
          echo "outcome: $OUTCOME"
          echo "entities: $ENTITIES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENTITIES" ]; then
              echo "FAIL: action succeeded but entities output is empty"
              exit 1
            fi
            echo "PASS: SEARCH succeeded with entities output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
