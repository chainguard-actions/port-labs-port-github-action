name: Test SEARCH operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          baseUrl: 'https://api.getport.io'
          clientId: 'test-client-id'
          clientSecret: 'test-client-secret'
          operation: 'SEARCH'
          query: '{"combinator":"and","rules":[{"property":"$identifier","operator":"contains","value":"test"}]}'
          include: 'properties.prop1,identifier'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with SEARCH inputs"
