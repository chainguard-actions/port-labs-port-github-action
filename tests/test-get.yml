name: Test GET operation
on:
  workflow_dispatch:
jobs:
  test-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GET operation
        id: get
        uses: .
        continue-on-error: true
        with:
          baseUrl: 'https://api.port.io'
          clientId: 'fake-client-id'
          clientSecret: 'fake-client-secret'
          operation: 'GET'
          blueprint: 'service'
          identifier: 'test-service'

      - name: Assert action ran and failed gracefully (auth error expected)
        env:
          OUTCOME: ${{ steps.get.outcome }}
          ENTITY: ${{ steps.get.outputs.entity }}
        run: |
          echo "outcome: $OUTCOME"
          echo "entity: $ENTITY"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENTITY" ]; then
              echo "FAIL: action succeeded but entity output is empty"
              exit 1
            fi
            echo "PASS: GET succeeded with entity output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
