name: 'test'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - run: |
          npm install
      - run: |
          npm run build && npm test
        env:
          PORT_BASE_URL: ${{ secrets.PORT_BASE_URL }}
          INPUT_BASEURL: ${{ secrets.PORT_BASE_URL }}
          INPUT_CLIENTID: ${{ secrets.PORT_CLIENT_ID }}
          INPUT_CLIENTSECRET: ${{ secrets.PORT_CLIENT_SECRET }}
